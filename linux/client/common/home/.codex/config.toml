model = "gpt-5.4"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
web_search = "live"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
writable_roots = []

[agents]
max_threads = 7
max_depth = 1
job_max_runtime_seconds = 14400

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[tui]
theme = "nord"
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit", "thread-title"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[notice]
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.5"
"gpt-5.2" = "gpt-5.4"
"gpt-5.4" = "gpt-5.5"

[projects."/home/artem/code"]
trust_level = "trusted"
[projects."/home/artem/dotfiles"]
trust_level = "trusted"
[projects."/home/artem/code/amnezia-tg"]
trust_level = "trusted"
[projects."/home/artem/code/full-stack-template"]
trust_level = "trusted"
