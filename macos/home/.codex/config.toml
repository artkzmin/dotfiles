model = "gpt-5.6-luna"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
web_search = "live"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

service_tier = "default"
personality = "pragmatic"

[sandbox_workspace_write]
network_access = true

[agents]
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 14400

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[tui]
theme = "nord"
status_line = ["model-with-reasoning", "context-remaining", "five-hour-limit", "weekly-limit", "thread-title"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[notice]
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.4" = "gpt-5.6-terra"
"gpt-5.4-mini" = "gpt-5.6-luna"

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
appearanceLightCodeThemeId = "codex"
appearanceDarkCodeThemeId = "codex"
conversationDetailMode = "STEPS_COMMANDS"
preventSleepWhileRunning = true
mac-menu-bar-enabled = false

[desktop.open-in-target-preferences]
global = "zed"

[desktop.appearanceLightChromeTheme]
accent = "#0169cc"
contrast = 45
ink = "#0d0d0d"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#751ed9"

[desktop.appearanceDarkChromeTheme]
accent = "#0169cc"
contrast = 60
ink = "#fcfcfc"
opaqueWindows = true
surface = "#111111"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#b06dff"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[features]
js_repl = false
memories = false
chronicle = false

[memories]
generate_memories = false
use_memories = false
